name: Publish Caelogram CLI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance attestations; no secret value is exposed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          }
      - run: npm run check
      - run: npm run check:cloud
      - run: npm test
      - run: npm run build
      - name: The bundled binary must run from the staged package
        run: node dist/package/cli.js --version
      # Publishes dist/package: the bundled CLI and a generated manifest with no
      # dependencies. Provenance uses the OIDC token from id-token: write.
      - run: npm publish ./dist/package --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
