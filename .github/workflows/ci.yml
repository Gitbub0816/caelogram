name: Validate Caelogram
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:cloud
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - run: node --check integrations/vscode/extension.cjs
